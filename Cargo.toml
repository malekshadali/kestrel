[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"
default-run = "kes"

[[bin]]
name = "kes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
indicatif = "0.18.6"
strum = {version = "0.28.0", features = ["derive"]}
strum_macros = "0.28.0"
tabled = "0.22.0"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
sysinfo = "0.39.6"
winit = "0.30.13"
softbuffer = "0.4.8"
fontdue = "0.9.4"